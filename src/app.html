<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<title>Johannes Aas</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="rgb(250, 250, 250)" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Funnel+Sans:wght@300..800&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
		<script>
			;(() => {
				try {
					const ids = ['theme-1', 'theme-2', 'theme-3', 'theme-4', 'theme-5', 'theme-6']
					const saved = localStorage.getItem('theme')
					const id = ids.includes(saved)
						? saved
						: matchMedia('(prefers-color-scheme: dark)').matches
							? ids[ids.length - 1]
							: ids[0]
					const html = document.documentElement
					html.classList.add(id)
					if (sessionStorage.getItem('skip-intro')) html.classList.add('skip-intro')
					const bg = getComputedStyle(html).getPropertyValue('--color-body').trim()
					if (bg) document.querySelector('meta[name="theme-color"]')?.setAttribute('content', bg)
				} catch {}
			})()
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
